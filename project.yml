# XcodeGen tanımı. CI'da `xcodegen generate` ile AIAssistant.xcodeproj üretilir.
name: AIAssistant
options:
  bundleIdPrefix: dev.cagri
  deploymentTarget:
    iOS: "17.0"

packages:
  AgentCore:
    path: Packages/AgentCore

targets:
  AIAssistant:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AgentCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI Asistan
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cagri.aiassistant
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
