# XcodeGen tanımı. CI'da `xcodegen generate` ile AIAssistant.xcodeproj üretilir.
name: AIAssistant
options:
  bundleIdPrefix: dev.cagri
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

packages:
  AgentCore:
    path: Packages/AgentCore
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  AIAssistant:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AgentCore
      - package: MarkdownUI
      - package: ZIPFoundation
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CHAY
        CFBundleDevelopmentRegion: en
        # Uygulama metinleri Localization.swift'teki L(...) ile; bu liste iOS'un kendi metinleri için.
        CFBundleLocalizations: [en, tr]
        NSCameraUsageDescription: Takes photos to send to models that accept images.
        NSMicrophoneUsageDescription: Records audio messages for models that accept audio input.
        NSPhotoLibraryAddUsageDescription: Saves images generated by the assistant to your photo library.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iOS 26+: uzun cevaplar uygulamadan çıkınca da sürsün (ContinuedTurn).
        UIBackgroundModes: [processing]
        # İkincisi: Sideloadly "Use automatic bundle ID" kimliğin sonuna hesabın takım kodunu ekliyor.
        BGTaskSchedulerPermittedIdentifiers: ["dev.cagri.aiassistant.turn.*", "dev.cagri.aiassistant.ZU45CA9V93.turn.*"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cagri.aiassistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
