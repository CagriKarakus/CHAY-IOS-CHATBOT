name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: AgentCore testleri
        run: swift test --package-path Packages/AgentCore

      - name: Xcode projesini üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: iPhone için imzasız build
        run: |
          xcodebuild build \
            -project AIAssistant.xcodeproj \
            -scheme AIAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: .ipa paketle
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AIAssistant.app Payload/
          zip -qry AIAssistant.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: AIAssistant-ipa
          path: AIAssistant.ipa
          retention-days: 14
