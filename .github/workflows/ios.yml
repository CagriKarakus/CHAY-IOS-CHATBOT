name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı daldaki eski build, yenisi gelince iptal edilir.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `macos-latest` değişince Xcode ve SDK habersiz değişmesin.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5

      - name: Paket önbelleği
        uses: actions/cache@v6
        with:
          # Sadece indirilen kaynaklar: derlenmiş dosyalar Xcode sürümü değişince sorun çıkarabilir.
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/AgentCore/Package.swift', 'Packages/AgentCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: AgentCore testleri
        run: swift test --package-path Packages/AgentCore

      - name: Xcode projesini üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: iPhone için imzasız build
        run: |
          xcodebuild build \
            -project AIAssistant.xcodeproj \
            -scheme AIAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: .ipa paketle
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AIAssistant.app Payload/
          zip -qry AIAssistant.ipa Payload

      - uses: actions/upload-artifact@v6
        with:
          name: AIAssistant-ipa
          path: AIAssistant.ipa
          retention-days: 14
